name: Build hactl deb packeges

on:
  push:
    tags:
    - "*"

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        host:
        - ubuntu-24.04-arm
        - ubuntu-24.04
    runs-on: ${{ matrix.host }}
    steps:
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends build-essential debhelper-compat golang
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - run: make deb
    - run: mv ../hactl_* ./
    - run: sed -i '/\.buildinfo$/d' hactl_*.changes
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        archive: false
        name: deb
        path: hactl_*.deb
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        archive: false
        name: changes
        path: hactl_*.changes

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        merge-multiple: true
    - name: Create draft release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        tag="${{ github.ref_name }}"
        gh release create "$tag" \
          --verify-tag \
          --notes "$tag" \
          --repo "${{ github.repository }}" \
          --draft \
          --title "$tag" \
          artifacts/*
